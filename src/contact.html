        <div class="container">
            <div class="section">
                <h2>Contact Me</h2>
                <form class="contact-form" action="https://formspree.io/f/xwvabnvr" method="POST">
                    <input type="hidden" name="_next" value="https://jjbdevs.github.io/portfolio/src/contact.html">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
                <div class="contact-info">
                    <p><strong>Email:</strong> <a href="mailto:jjthejb@gmail.com">jjthejb@gmail.com</a></p>
                    <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/joshua---brown/" target="_blank">linkedin.com/in/joshua---brown</a></p>
                    <p><strong>GitHub:</strong> <a href="https://github.com/jjbdevs" target="_blank" class="contact-btn">GitHub Profile</a></p>
